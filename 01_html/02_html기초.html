<!DOCTYPE html>
<html lang="ko">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../01_html/02_html기초.css">
    <!--브라우저 탭의 제목-->
    <title>계좌 페이지 연습</title>
</head>
<body>
    <!-- 계좌 카드 하나 = 독립적인 콘텐츠 묶음이므로 article 사용 -->
<article class="account-card">

  <!-- 카드의 제목 역할이므로 header로 묶음 -->
  <header>
    <!-- 은행명은 이 카드의 대표 제목이므로 h2 (페이지 전체 제목 h1은 따로 있다고 가정) -->
    <h2>우리은행</h2>
  </header>

  <!-- 계좌 정보(번호, 잔액)는 서로 연관된 설명 데이터이므로 dl(정의 목록)로 구조화 -->
  <dl>
    <!-- dt: 설명 대상(용어), dd: 그 값 -->
    <dt>계좌번호</dt>
    <!-- 마스킹된 숫자/코드 형태의 값이므로 code 태그로 의미 부여 -->
    <dd><code>1002-***-******12</code></dd>

    <dt>잔액</dt>
    <!-- 금액은 강조되어야 하는 중요한 수치이므로 strong 사용 -->
    <dd><strong>1,250,000원</strong></dd>
  </dl>

  <!-- 사용자가 취할 수 있는 행동(동작) 버튼들의 묶음이므로 footer로 구분 -->
  <footer>
    <!-- 클릭 시 동작(이체 페이지 이동/모달 등)을 수행하므로 button -->
    <button type="button">이체</button>
    <button type="button">상세</button>
  </footer>

</article>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나를 대표하는 키워드 | Seoyoung</title>
<meta name="description" content="서영을 대표하는 3가지 키워드">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="keyword.css">
</head>
<body>

<a class="skip-link" href="#main-content">본문으로 바로가기</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">Seoyoung.dev</a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav" aria-label="메뉴 열기">
      ☰
    </button>
    <nav class="main-nav" id="mainNav" aria-label="주요 메뉴">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="keyword.html" aria-current="page">Keywords</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main-content">
  <section aria-labelledby="keyword-heading">
    <p class="section-eyebrow">About Me</p>
    <h1 class="section-title" id="keyword-heading">나를 대표하는 3가지 키워드</h1>

    <ul class="keyword-grid">
      <li class="keyword-card">
        <div class="emoji" aria-hidden="true">🎬</div>
        <h2>내가 즐겨보는 콘텐츠는?</h2>
        <p>넷플릭스</p>
      </li>

      <li class="keyword-card">
        <div class="emoji" aria-hidden="true">🧁</div>
        <h2>나의 취미는?</h2>
        <p>베이킹</p>
      </li>

      <li class="keyword-card">
        <div class="emoji" aria-hidden="true">🎧</div>
        <h2>외출할 때 꼭 챙기는 물품은?</h2>
        <p>지갑 &amp; 에어팟</p>
      </li>
    </ul>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
    <small>&copy; 2026 Seoyoung. Built with vanilla HTML/CSS/JS.</small>
  </div>
</footer>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var nav = document.getElementById('mainNav');

    toggle.addEventListener('click', function () {
      var isOpen = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
    });

    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A' && window.innerWidth <= 720) {
        nav.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>

</body>
</html>
